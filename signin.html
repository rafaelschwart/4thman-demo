<body class="min-h-screen flex flex-col md:flex-row antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Left Panel: Brand Context -->
<div class="hidden md:flex flex-col justify-center px-margin-desktop w-1/2 relative z-10 border-r border-outline-variant/30 bg-[#0C0C0E]">
<div class="max-w-md mx-auto">
<h1 class="font-display-lg text-display-lg text-on-surface mb-gutter">4TH MAN</h1>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-xl">Train the whole man.</h2>
<p class="font-scripture text-scripture text-on-surface-variant italic mt-xl border-l-2 border-outline-variant pl-4 py-2">
                "...the form of the fourth is like the Son of God. — Daniel 3:25"
            </p>
</div>
<!-- Ambient decorative elements -->
<div class="absolute inset-0 pointer-events-none opacity-5" style="background-image: radial-gradient(circle at 30% 50%, #f0bf6a 0%, transparent 50%);"></div>
</div>
<!-- Right Panel: Auth Surface -->
<div class="flex-1 flex flex-col justify-center px-margin-mobile md:px-margin-desktop bg-[#0C0C0E]">
<!-- Mobile Header (hidden on md) -->
<div class="md:hidden text-center mb-xl mt-lg">
<h1 class="font-display-lg text-display-lg text-on-surface">4TH MAN</h1>
</div>
<!-- Auth Card -->
<div class="w-full max-w-md mx-auto bg-[#161618] p-lg rounded-xl border border-outline-variant/50 shadow-2xl relative z-20">
<div class="mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface">Sign In</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Access your training matrix.</p>
</div>
<form class="space-y-gutter">
<!-- Email Input -->
<div class="space-y-xs">
<label class="block font-body-md text-body-md text-on-surface-variant" for="email">Email</label>
<input class="w-full input-forge border rounded-lg px-4 py-3 font-body-lg text-body-lg text-on-surface transition-colors duration-200 placeholder-on-surface-variant/50" id="email" name="email" placeholder="user@example.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label class="block font-body-md text-body-md text-on-surface-variant" for="password">Password</label>
<div class="relative">
<input class="w-full input-forge border rounded-lg px-4 py-3 font-body-lg text-body-lg text-on-surface transition-colors duration-200 placeholder-on-surface-variant/50 pr-12" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-sm space-y-gutter">
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-3 px-6 rounded-xl hover:bg-primary transition-all duration-200 active:scale-[0.98]" type="submit">
                        Sign In
                    </button>
<button class="w-full bg-transparent border border-outline-variant text-on-surface font-body-lg text-body-lg py-3 px-6 rounded-xl hover:bg-surface-container-high hover:border-outline transition-all duration-200 active:scale-[0.98]" type="button">
                        Create Account
                    </button>
</div>
</form>
<div class="mt-lg text-center">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">
                    Forgot password?
                </a>
</div>
